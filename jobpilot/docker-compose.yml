version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:///./jobpilot.db
    volumes:
      - ./data:/app/data
      - ./jobpilot.db:/app/jobpilot.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Uncomment for PostgreSQL + Redis in production:
  #
  # db:
  #   image: postgres:16-alpine
