  #     POSTGRES_DB: jobpilot
  #     POSTGRES_USER: jobpilot
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #
  # redis:
  #   image: redis:7-alpine
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis_data:/data

volumes:
  data:
