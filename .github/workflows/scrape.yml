name: Scheduled job sweep

on:
  schedule:
    # every 2 hours: 00,02,...,22 UTC = 05:00,07:00,...,03:00 PKT
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: job-sweep
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run sweep (no Gmail drafts)
        run: python3 run.py --top 20
        working-directory: auto-scraper

      - name: Commit results
        run: |
          git config user.name "job-pilot-bot"
          git config user.email "job-pilot-bot@users.noreply.github.com"
          git add auto-scraper/results auto-scraper/applied.json
          git diff --cached --quiet || git commit -m "sweep: $(date -u +%F_%H%M) results"
          git push
